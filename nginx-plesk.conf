# Nginx configuration baseline for Plesk
# Add these directives in:
# Plesk -> billiardtoday.com -> Apache & nginx Settings -> Additional nginx directives

# Root public site -> Next.js frontend on port 3022
location / {
    proxy_pass http://localhost:3022;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}

location /_next/static {
    proxy_pass http://localhost:3022/_next/static;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    expires 365d;
    add_header Cache-Control "public, immutable";

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_vary on;
}

location /_next/image {
    proxy_pass http://localhost:3022/_next/image;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location /_next/data {
    proxy_pass http://localhost:3022/_next/data;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
}

location ~ ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
    proxy_pass http://localhost:3022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}
